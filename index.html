<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Masjid Putra visitor tour</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alegreya:wght@500;700&family=Alegreya+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FBF6F6; --surface:#FFFFFF; --ink:#2E1F2A; --muted:#6E5C67;
  --rose:#B76E79; --rose-soft:#F1DCDF; --lake:#2C6A6E; --lake-ink:#FFFFFF;
  --gold:#9C7A40; --line:#EAD9DC; --sky:#E3EDED; --stone:#EBD3D1; --marble:#FFFFFF;
  --gold-ink:#7A5E2C; --rose-strong:#9A4F5B;
  --scan-bg:#120D10; --scan-ink:#F7EEF0;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#1B1318; --surface:#251B21; --ink:#F4E9EC; --muted:#BBA6B1;
    --rose:#D79AA3; --rose-soft:#3B2A32; --lake:#78B9BC; --lake-ink:#0F2526;
    --gold:#D4B47C; --line:#3A2C33; --sky:#1E2A2B; --stone:#4A353C; --marble:#3A2D33; --gold-ink:#D4B47C; --rose-strong:#D79AA3; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1B1318; --surface:#251B21; --ink:#F4E9EC; --muted:#BBA6B1;
  --rose:#D79AA3; --rose-soft:#3B2A32; --lake:#78B9BC; --lake-ink:#0F2526;
  --gold:#D4B47C; --line:#3A2C33; --sky:#1E2A2B; --stone:#4A353C; --marble:#3A2D33; --gold-ink:#D4B47C; --rose-strong:#D79AA3; color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 64px)}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:"Alegreya Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:18px; line-height:1.55; -webkit-font-smoothing:antialiased;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
h1,h2,h3{font-family:"Alegreya",Georgia,serif;font-weight:700;line-height:1.15;margin:0}
a{color:var(--lake)}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--lake);outline-offset:3px;border-radius:6px}

.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;gap:8px;padding:10px 16px;background:var(--bg);border-bottom:1px solid var(--line)}
.bar .name{font-family:"Alegreya",Georgia,serif;font-weight:700;font-size:18px;flex:1;text-decoration:none;color:var(--ink)}
.iconbtn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;padding:0 12px;border-radius:20px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:15px;text-decoration:none;cursor:pointer}
.iconbtn svg{width:18px;height:18px}
.bar[hidden]{display:none}

main{max-width:540px;margin:0 auto;padding:20px 20px 48px}

.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:54px;padding:0 20px;border-radius:14px;border:0;cursor:pointer;background:var(--lake);color:var(--lake-ink);font-weight:700;font-size:18px;text-decoration:none;text-align:center;line-height:1.2}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn svg{width:20px;height:20px;flex:none}
.stack>*+*{margin-top:12px}

.ill{display:block;width:100%;height:auto;border-radius:18px;overflow:hidden}
.hero{margin:0 -20px;width:calc(100% + 40px);border-radius:0 0 28px 28px}

/* Welcome */
.welcome{margin-top:-20px}
.welcome h1{font-size:44px;text-align:center;margin-top:22px}
.welcome .lede{text-align:center;color:var(--muted);max-width:32ch;margin:10px auto 0}
.langs{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:24px 0}
.lang{min-height:40px;padding:0 14px;border-radius:20px;border:1.5px solid var(--line);background:var(--surface);cursor:pointer;font-size:16px}
.lang[aria-pressed="true"]{border-color:var(--lake);background:var(--lake);color:var(--lake-ink);font-weight:700}
.note{font-size:15px;color:var(--muted);text-align:center;margin-top:18px}
.badge{display:block;width:max-content;max-width:100%;margin:28px auto 0;font-size:13px;color:var(--gold-ink);border:1px solid var(--gold-ink);border-radius:20px;padding:3px 12px}
.strip{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:22px 0 0}
.strip svg{border-radius:12px}

/* Map */
.map h1{font-size:34px}
.map .sub{color:var(--muted);margin:6px 0 0}
.plan{display:block;width:100%;height:auto;margin:16px 0 4px}
.plan .site{fill:var(--surface);stroke:var(--line);stroke-width:2}
.plan .zone{fill:var(--rose-soft);stroke:var(--rose);stroke-width:1.5}
.plan .wet{fill:var(--sky);stroke:var(--lake);stroke-width:1.5}
.plan .court{fill:none;stroke:var(--line);stroke-width:2;stroke-dasharray:6 5}
.plan .lbl{font-size:12px;fill:var(--muted);font-family:"Alegreya Sans",sans-serif}
.plan .path{fill:none;stroke:var(--lake);stroke-width:3;stroke-dasharray:2 7;stroke-linecap:round;stroke-linejoin:round}
.plan .stop{fill:var(--surface);stroke:var(--rose);stroke-width:2.5}
.plan .stop.v{fill:var(--rose-strong);stroke:var(--rose-strong)}
.plan .stop.cur{fill:var(--lake);stroke:var(--lake)}
.plan .sn{font-family:"Alegreya",serif;font-weight:700;font-size:14px;fill:var(--ink);text-anchor:middle;dominant-baseline:central;pointer-events:none}
.plan .sn.on{fill:var(--bg)}
.plan .halo{fill:none;stroke:var(--lake);stroke-width:2;opacity:.45}
.caption{font-size:14px;color:var(--muted);margin:0 0 18px}
.list{list-style:none;padding:0;margin:20px 0 24px;border-top:1px solid var(--line)}
.list a{display:flex;gap:14px;align-items:center;padding:12px 2px;border-bottom:1px solid var(--line);text-decoration:none;color:var(--ink)}
.list .thumb{flex:none;width:64px;border-radius:10px;overflow:hidden}
.list .thumb svg{display:block;width:100%;height:auto}
.list .t{flex:1;min-width:0}
.list .t b{display:block;font-weight:700}
.list .t span{display:block;font-size:15px;color:var(--muted)}
.list .chk{color:var(--rose-strong);font-size:14px}

/* Station */
.st-meta{margin:16px 0 0;font-size:15px;color:var(--muted)}
.st-title{font-size:32px;margin-top:2px}
.listen{margin:20px 0 6px;display:flex;align-items:center;gap:14px;width:100%;padding:12px 16px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);cursor:pointer;text-align:left}
.listen .ic{flex:none;width:44px;height:44px;border-radius:50%;background:var(--lake);color:var(--lake-ink);display:grid;place-items:center}
.listen .ic svg{width:20px;height:20px}
.listen b{display:block}
.listen span{display:block;font-size:14px;color:var(--muted)}
.narr p{margin:16px 0 0;max-width:62ch}
.narr p:first-child{font-family:"Alegreya",Georgia,serif;font-size:21px;line-height:1.45}
h2.sec{font-size:22px;margin:34px 0 12px}

.steps{list-style:none;padding:0;margin:20px 0 0;display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.steps li{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 6px;text-align:center;font-size:14px;line-height:1.25}
.steps li i{display:block;font-style:normal;font-family:"Alegreya",serif;font-weight:700;color:var(--rose);font-size:18px}

.adhan{margin:0;border-top:1px solid var(--line)}
.adhan div{padding:12px 0;border-bottom:1px solid var(--line)}
.adhan .tr{font-family:"Alegreya",serif;font-size:19px;font-style:italic}
.adhan .en{display:block;color:var(--muted);font-size:16px}
.adhan .x{float:right;font-size:13px;color:var(--gold-ink);margin-top:4px}

.src{background:var(--surface);border-radius:4px 18px 18px 18px;padding:16px 18px;border-left:4px solid var(--rose);margin-top:14px}
.src .en{font-family:"Alegreya",Georgia,serif;font-size:20px;line-height:1.45;margin:0}
.src .ref{font-size:14px;color:var(--gold-ink);margin:8px 0 0;font-weight:500}
.src .ctx{font-size:15px;color:var(--muted);margin:6px 0 0}

.morelink{display:flex;align-items:center;gap:12px;margin-top:28px;padding:16px 18px;border-radius:16px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);text-decoration:none}
.morelink>span{flex:1}
.morelink b{display:block;font-family:"Alegreya",serif;font-size:20px}
.morelink span span{display:block;color:var(--muted);font-size:15px}
.morelink svg{width:22px;height:22px;color:var(--lake);flex:none}

details.where{margin-top:16px;border:1.5px solid var(--line);border-radius:14px;padding:0 14px;background:var(--surface)}
details.where summary{cursor:pointer;padding:12px 0;font-weight:700;list-style:none}
details.where summary::-webkit-details-marker{display:none}
details.where .plan{margin-top:0}

.tip{margin-top:16px;padding:16px 18px;border-radius:14px;background:var(--rose-soft)}
.tip b{display:block;font-family:"Alegreya",serif;font-size:18px;margin-bottom:2px}

.stepper{display:flex;gap:10px;margin-top:32px}
.stepper .btn{flex:1}
.stepper .btn.ghost{flex:0 0 auto;width:auto}

/* Qibla finder (optional, mihrab station) */
.qibla{margin-top:16px;padding:16px 18px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface)}
.qibla b{display:block;font-family:"Alegreya",serif;font-size:18px}
.qibla p{margin:4px 0 12px;font-size:15px;color:var(--muted)}
.qibla .dial{position:relative;width:200px;height:200px;margin:8px auto 4px}
.qibla .dial svg{position:absolute;inset:0;width:100%;height:100%}
.qibla #qArrow{transition:transform .15s linear;transform-origin:50% 50%}
.qibla .read{text-align:center;font-weight:700;margin:6px 0 0;color:var(--ink)}
.qibla[data-on="false"] .live{display:none}
.qibla[data-on="true"] .start{display:none}

/* Know more */
.more .refs{padding-left:20px;margin:8px 0 0}
.more .refs li{margin:6px 0;color:var(--muted)}

/* FAQ */
.faq h1{font-size:32px}
.faq details{border-bottom:1px solid var(--line)}
.faq details:first-of-type{border-top:1px solid var(--line);margin-top:20px}
.faq summary{cursor:pointer;padding:16px 28px 16px 0;font-weight:700;list-style:none;position:relative}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";position:absolute;right:4px;top:12px;font-size:24px;color:var(--rose);font-weight:400}
.faq details[open] summary::after{content:"\2212"}
.faq details p{margin:0 0 16px}
textarea{width:100%;min-height:110px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);padding:12px 14px;font:inherit;resize:vertical;margin:8px 0 12px}
.sent{padding:16px 18px;border-radius:14px;background:var(--rose-soft)}

/* Finish */
.finish{margin-top:-20px}
.finish h1{font-size:36px;text-align:center;margin-top:22px}
.finish .lede{text-align:center;color:var(--muted);margin:10px auto 0;max-width:34ch}
.rate{display:flex;gap:8px;justify-content:center;margin:12px 0}
.rate button{color:var(--ink);width:48px;height:48px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);cursor:pointer;font-size:18px}
.rate button[aria-pressed="true"]{background:var(--rose-strong);border-color:var(--rose-strong);color:var(--bg)}
.q{text-align:center;font-weight:700;margin-top:26px}
.choice{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:10px}

/* Scan overlay */
.scan{position:fixed;inset:0;z-index:20;background:var(--scan-bg);color:var(--scan-ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:calc(env(safe-area-inset-top,0px) + 24px) 24px calc(env(safe-area-inset-bottom,0px) + 24px)}
.scan[hidden]{display:none}
.frame{position:relative;width:230px;height:230px;border-radius:22px;border:3px solid var(--scan-ink);overflow:hidden}
.frame::after{content:"";position:absolute;left:8%;right:8%;height:3px;background:var(--rose);top:10%;animation:sweep 1.3s ease-in-out infinite alternate}
@keyframes sweep{to{top:88%}}
.frame video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:none}
.scan.live .frame video{display:block}
.frame::after{z-index:1}

/* Station plaques (staff print view) */
.plaques .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-top:20px}
.plaque{background:#fff;color:#111;border:1px solid var(--line);border-radius:14px;padding:14px;text-align:center;break-inside:avoid}
.plaque svg{display:block;width:100%;height:auto;max-width:220px;margin:0 auto}
.plaque b{display:block;font-family:"Alegreya",serif;font-size:18px;margin-top:6px}
.plaque span{display:block;font-size:13px;color:#444;word-break:break-all}
.stafflink{display:block;text-align:center;font-size:14px;color:var(--muted);margin-top:14px}
@media print{.bar,.noprint,#toast{display:none!important}body{background:#fff}main{max-width:none;padding:0}.plaques .grid{grid-template-columns:repeat(2,1fr)}}
.scan p{margin:0;text-align:center;max-width:28ch}
.scan small{opacity:.7;font-size:14px}
.scan .btn.ghost{color:var(--scan-ink);border-color:var(--scan-ink);width:auto}

#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 22px);transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:15px;opacity:0;pointer-events:none;transition:.25s;z-index:30;max-width:90vw;text-align:center}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (max-width:380px){.steps{grid-template-columns:repeat(2,1fr)}.welcome h1{font-size:38px}}
</style>
</head>
<body>
<header class="bar" id="bar" hidden>
  <a class="iconbtn" id="backBtn" href="#tour" aria-label="Back to tour map">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
  </a>
  <a class="name" href="#tour" id="barName">Masjid Putra</a>
  <a class="iconbtn" href="#questions">Questions</a>
</header>
<main id="app"></main>

<div class="scan" id="scan" hidden role="dialog" aria-modal="true" aria-label="Scan station code">
  <div class="frame" aria-hidden="true"><video id="scanVideo" playsinline muted></video></div>
  <p id="scanMsg">Point your camera at the QR code on the station plaque</p>
  <small id="scanHint" aria-live="polite">Starting camera…</small>
  <button class="btn ghost" id="scanCancel">Cancel</button>
</div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
/* ---------- Mosque config: swap these to demo another masjid ---------- */
const MOSQUE = {
  name: "Masjid Putra",
  intro: "Built of rose-tinted granite on the edge of Putrajaya Lake, Masjid Putra welcomes visitors of every faith."
};

/* ---------- Illustrations (placeholders for real photography) ---------- */
function wrap(inner,label,h=220){return `<svg class="ill" viewBox="0 0 400 ${h}" role="img" aria-label="${label}">${inner}</svg>`}
function starPts(cx,cy,R,r,n=8,rot=-90){let p=[];for(let k=0;k<n*2;k++){const a=(rot+k*180/n)*Math.PI/180,rr=k%2?r:R;p.push((cx+rr*Math.cos(a)).toFixed(1)+","+(cy+rr*Math.sin(a)).toFixed(1))}return p.join(" ")}

function mosqueShapes(){
  let s=`<rect x="110" y="120" width="180" height="50" fill="var(--rose)"/>
  <path d="M145 120 C145 72 172 50 200 50 C228 50 255 72 255 120Z" fill="var(--rose)"/>
  <path d="M120 120 C120 104 128 96 136 96 C144 96 152 104 152 120Z" fill="var(--rose)"/>
  <path d="M248 120 C248 104 256 96 264 96 C272 96 280 104 280 120Z" fill="var(--rose)"/>
  <line x1="200" y1="50" x2="200" y2="34" stroke="var(--gold)" stroke-width="3"/><circle cx="200" cy="31" r="3.5" fill="var(--gold)"/>
  <rect x="306" y="60" width="16" height="110" fill="var(--rose)"/><polygon points="306,60 314,36 322,60" fill="var(--rose)"/>
  <rect x="301" y="94" width="26" height="5" fill="var(--stone)"/><rect x="301" y="128" width="26" height="5" fill="var(--stone)"/>`;
  [126,158,190,222,254].forEach((x,k)=>{const w=k===2?20:16;s+=`<path d="M${x} 170 v-24 a${w/2} ${w/2} 0 0 1 ${w} 0 v24z" fill="var(--rose-soft)"/>`});
  return s;
}
function heroIll(){
  return `<svg class="ill hero" viewBox="0 0 400 250" role="img" aria-label="The mosque beside the lake">
  <rect width="400" height="250" fill="var(--sky)"/>
  <circle cx="80" cy="64" r="24" fill="var(--gold)" opacity=".45"/>
  <path d="M250 40 q8-7 16 0 q8-7 16 0" stroke="var(--ink)" stroke-width="2" fill="none" opacity=".4"/>
  ${mosqueShapes()}
  <rect y="170" width="400" height="80" fill="var(--lake)" opacity=".28"/>
  <g transform="translate(0 340) scale(1 -1)" opacity=".18">${mosqueShapes()}</g>
  <path d="M40 196 h60 M150 212 h90 M280 202 h70 M60 230 h50" stroke="var(--marble)" stroke-width="2.5" stroke-linecap="round" opacity=".7"/>
  </svg>`;
}

const ILL = {
 dress(){
  const robe=(x,c)=>`<path d="M${x} 46 V34 q0-8 7-8" stroke="var(--ink)" stroke-width="2.5" fill="none" opacity=".55"/>
   <path d="M${x-30} 62 L${x} 46 L${x+30} 62" stroke="var(--ink)" stroke-width="3" fill="none" opacity=".55"/>
   <path d="M${x-28} 62 L${x-52} 112 L${x-40} 118 L${x-28} 94 L${x-32} 196 H${x+32} L${x+28} 94 L${x+40} 118 L${x+52} 112 L${x+28} 62 Q${x} 76 ${x-28} 62Z" fill="${c}"/>
   <path d="M${x} 70 V196" stroke="var(--marble)" stroke-width="1.5" opacity=".35"/>`;
  return wrap(`<rect width="400" height="220" fill="var(--rose-soft)"/><rect y="196" width="400" height="24" fill="var(--stone)"/>
   <line x1="40" y1="26" x2="360" y2="26" stroke="var(--gold)" stroke-width="5" stroke-linecap="round"/>
   ${robe(110,"var(--lake)")}${robe(200,"var(--rose)")}${robe(290,"var(--gold)")}`,"Visitor robes on a rail");
 },
 ablution(){
  let s=`<rect width="400" height="220" fill="var(--sky)"/><rect width="400" height="132" fill="var(--stone)"/>
   <rect y="36" width="400" height="5" fill="var(--rose)" opacity=".4"/><rect y="168" width="400" height="52" fill="var(--rose-soft)"/>`;
  for(let k=0;k<6;k++){const x=50+k*56;
   s+=`<path d="M${x} 56 v18 h12 v6" stroke="var(--gold)" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
   <line x1="${x+12}" y1="90" x2="${x+12}" y2="124" stroke="var(--lake)" stroke-width="3" stroke-dasharray="5 6" stroke-linecap="round"/>
   <rect x="${x}" y="176" width="24" height="30" rx="5" fill="var(--rose)"/>`}
  s+=`<rect x="24" y="128" width="352" height="20" rx="4" fill="var(--marble)"/><rect x="24" y="148" width="352" height="6" fill="var(--lake)" opacity=".35"/>`;
  return wrap(s,"Row of taps and stools in the ablution area");
 },
 threshold(){
  const shoe=(x,y,c)=>`<rect x="${x}" y="${y}" width="18" height="10" rx="5" fill="${c}"/>`;
  return wrap(`<rect width="400" height="220" fill="var(--stone)"/><rect y="196" width="400" height="24" fill="var(--rose-soft)"/>
   <path d="M150 196 V100 a50 50 0 0 1 100 0 V196Z" fill="var(--lake)"/>
   <path d="M162 196 V104 a38 38 0 0 1 76 0 V196Z" fill="var(--marble)" opacity=".5"/>
   <polygon points="162,196 238,196 226,158 174,158" fill="var(--rose)"/>
   <rect x="40" y="96" width="5" height="100" fill="var(--gold)"/><rect x="117" y="96" width="5" height="100" fill="var(--gold)"/>
   <rect x="40" y="110" width="82" height="5" fill="var(--gold)"/><rect x="40" y="150" width="82" height="5" fill="var(--gold)"/><rect x="40" y="190" width="82" height="5" fill="var(--gold)"/>
   ${shoe(50,100,"var(--ink)")}${shoe(72,100,"var(--rose)")}${shoe(94,100,"var(--lake)")}${shoe(52,140,"var(--lake)")}${shoe(86,140,"var(--ink)")}${shoe(64,180,"var(--rose)")}
   <rect x="268" y="184" width="22" height="11" rx="5.5" fill="var(--ink)" opacity=".75"/><rect x="294" y="187" width="22" height="11" rx="5.5" fill="var(--ink)" opacity=".75"/>
   <path d="M290 150 h44" stroke="var(--ink)" stroke-width="2" opacity=".0"/>`,"Shoe rack beside the prayer hall door");
 },
 hall(){
  let s=`<rect width="400" height="220" fill="var(--marble)"/><path d="M0 44 Q200 -18 400 44 V0 H0Z" fill="var(--stone)"/>

/* ---------- Audio narration (device voice in prototype) ---------- */
let speaking=false;
function setListen(b,on){b.querySelector(".ic").innerHTML=on?ICON.pause:ICON.play;b.querySelector("b").textContent=on?"Pause narration":"Listen to this station";b.setAttribute("aria-pressed",on)}
function stopAudio(){try{speechSynthesis.cancel()}catch(e){}speaking=false;const b=$(".listen");if(b)setListen(b,false)}
function toggleAudio(st,b){
  if(!("speechSynthesis" in window)){toast("Audio isn’t available in this browser. The text below has the full narration.");return}
  if(speaking){stopAudio();return}
  const u=new SpeechSynthesisUtterance(st.narr.join(" "));u.lang="en-GB";u.rate=0.95;
  u.onend=()=>{speaking=false;setListen(b,false)};
  speechSynthesis.cancel();speechSynthesis.speak(u);speaking=true;setListen(b,true);
}

/* ---------- Scan: live camera where possible, simulated otherwise ---------- */
const JSQR_SRC="vendor/jsQR-1.4.0.js", QRGEN_SRC="vendor/qrcode-generator-1.4.4.js";
const scanEl=$("#scan"), scanVideo=$("#scanVideo"), scanMsg=$("#scanMsg"), scanHint=$("#scanHint");
let scanTimer=0, scanRaf=0, scanStream=null, scanSession=0, scanReturnFocus=null;
const scripts={};
function loadScript(src){return scripts[src]||(scripts[src]=new Promise((ok,no)=>{const e=document.createElement("script");e.src=src;e.onload=ok;e.onerror=()=>{delete scripts[src];no(new Error("load "+src))};document.head.appendChild(e)}))}

/* A plaque's QR holds this page's URL plus #stationId; a bare station id also works. */
function stationFromCode(text){
  const t=String(text||"").trim();
  const key=(t.includes("#")?t.slice(t.lastIndexOf("#")+1):t.split(/[\/:?=&]/).pop()).toLowerCase();
  return STATIONS.find(s=>s.id===key)||null;
}
function stationUrl(id){return location.origin+location.pathname+"#"+id}

async function makeDecoder(){
  if("BarcodeDetector" in window){
    try{const f=await BarcodeDetector.getSupportedFormats();
      if(f.includes("qr_code")){const d=new BarcodeDetector({formats:["qr_code"]});return async v=>{const r=await d.detect(v);return r.length?r[0].rawValue:null}}}catch(e){}
  }
  await loadScript(JSQR_SRC);
  const c=document.createElement("canvas"), x=c.getContext("2d",{willReadFrequently:true});
  return async v=>{
    const w=v.videoWidth,h=v.videoHeight;if(!w||!h)return null;
    const k=Math.min(1,720/Math.max(w,h));c.width=Math.round(w*k);c.height=Math.round(h*k);
    x.drawImage(v,0,0,c.width,c.height);
    const r=jsQR(x.getImageData(0,0,c.width,c.height).data,c.width,c.height,{inversionAttempts:"attemptBoth"});
    return r?r.data:null;
  };
}

function stopCamera(){
  cancelAnimationFrame(scanRaf);scanRaf=0;
  if(scanStream){scanStream.getTracks().forEach(t=>t.stop());scanStream=null}
  scanVideo.srcObject=null;scanEl.classList.remove("live");
}
function closeScan(){
  scanSession++;clearTimeout(scanTimer);stopCamera();
  if(scanEl.hidden)return;
  scanEl.hidden=true;
  if(scanReturnFocus&&document.contains(scanReturnFocus))scanReturnFocus.focus();
  scanReturnFocus=null;
}
function goTo(id){closeScan();location.hash=id}
function simulate(id,why){
  stopCamera();
  scanMsg.textContent=why;
  scanHint.textContent="Opening your next station…";
  const my=scanSession;scanTimer=setTimeout(()=>{if(my===scanSession)goTo(id)},2200);
}

async function openScan(nextId){
  scanReturnFocus=document.activeElement;
  const my=++scanSession;
  scanEl.hidden=false;$("#scanCancel").focus();
  scanMsg.textContent="Point your camera at the QR code on the station plaque";
  scanHint.textContent="Starting camera…";
  if(!window.isSecureContext||!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){
    simulate(nextId,"The camera isn’t available on this page.");return;
  }
  try{
    const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"}},audio:false});
    if(my!==scanSession){stream.getTracks().forEach(t=>t.stop());return}
    scanStream=stream;scanVideo.srcObject=stream;await scanVideo.play();
    const decode=await makeDecoder();
    if(my!==scanSession)return;
    scanEl.classList.add("live");
    scanHint.textContent="Hold the code inside the frame.";
    let busy=false;
    const tick=async()=>{
      if(my!==scanSession)return;
      if(!busy&&scanVideo.readyState>=2){
        busy=true;
        try{const txt=await decode(scanVideo);
          if(txt&&my===scanSession){const st=stationFromCode(txt);
            if(st){goTo(st.id);return}
            scanHint.textContent="That code isn’t one of this tour’s stations.";}
        }catch(e){}
        busy=false;
      }
      scanRaf=requestAnimationFrame(tick);
    };
    tick();
  }catch(e){
    if(my!==scanSession)return;
    simulate(nextId,e&&e.name==="NotAllowedError"?"Camera access was declined.":"The camera couldn’t start.");
  }
}
$("#scanCancel").onclick=closeScan;
document.addEventListener("keydown",e=>{
  if(scanEl.hidden)return;
  if(e.key==="Escape"){e.preventDefault();closeScan()}
  else if(e.key==="Tab"){e.preventDefault();$("#scanCancel").focus()} /* only one control: keep focus in the dialog */
});

/* ---------- Station plaques (staff) ---------- */
function vPlaques(){
  setBack("#","Back to welcome");
  app.innerHTML=`<section class="plaques">
    <h1 class="st-title">Station QR plaques</h1>
    <p class="sub noprint">Print this page and fix each code at its station. Visitors can scan with the tour’s scan button or their phone’s own camera; both open the right station. The codes point to <b>${location.origin+location.pathname}</b>, so print from the address you’ll publish.</p>
    <button class="btn noprint" id="printBtn" style="margin-top:16px">Print plaques</button>
    <div class="grid" id="plaqueGrid"><p>Making codes…</p></div>
  </section>`;
  $("#printBtn").onclick=()=>window.print();
  loadScript(QRGEN_SRC).then(()=>{
    const g=$("#plaqueGrid");if(!g)return;
    g.innerHTML=STATIONS.map((st,i)=>{const q=qrcode(0,"M");q.addData(stationUrl(st.id));q.make();
      return `<div class="plaque">${q.createSvgTag({cellSize:6,margin:2,alt:"QR code for station "+(i+1)})}<b>${i+1}. ${st.title}</b><span>${st.place}</span></div>`}).join("");
  }).catch(()=>{const g=$("#plaqueGrid");if(g)g.innerHTML="<p>Couldn’t load the QR generator. Check your connection and reload.</p>"});
}

/* ---------- Qibla finder: opt-in, compass only, no camera ---------- */
const QIBLA=292.6; /* Masjid Putra (2.936N 101.690E) to the Kaaba, degrees from true north */
let qiblaOff=null;
function qiblaSupported(){
  return "DeviceOrientationEvent" in window && matchMedia("(pointer:coarse)").matches;
}
function mountQibla(){
  const slot=$("#qiblaSlot");if(!slot)return;
  slot.innerHTML=`<section class="qibla" data-on="false" aria-labelledby="qT">
    <b id="qT">Optional: find the qibla yourself</b>
    <div class="start"><p>Your phone’s compass can point toward Mecca. It uses motion sensors only, not the camera.</p>
      <button class="btn ghost" id="qStart">Try the qibla finder</button></div>
    <div class="live">
      <div class="dial" aria-hidden="true">
        <svg viewBox="0 0 200 200"><circle cx="100" cy="100" r="92" fill="var(--bg)" stroke="var(--line)" stroke-width="3"/>
          <circle cx="100" cy="100" r="74" fill="none" stroke="var(--rose-soft)" stroke-width="2" stroke-dasharray="3 6"/></svg>
        <svg viewBox="0 0 200 200" id="qArrow"><path d="M100 18 L122 70 H108 V140 H92 V70 H78 Z" fill="var(--lake)"/>
          <rect x="88" y="4" width="24" height="18" rx="2" fill="var(--ink)"/><rect x="88" y="9" width="24" height="3" fill="var(--gold)"/></svg>
      </div>
      <p class="read" id="qRead" aria-live="polite">Hold your phone flat…</p>
      <p>Hold the phone flat, top edge away from you, and turn until the arrow points straight ahead. If it seems off, move the phone in a figure-8 to calibrate. The mihrab in front of you is the true direction.</p>
      <button class="btn ghost" id="qStop">Stop</button>
    </div></section>`;
  $("#qStart").onclick=startQibla;
  $("#qStop").onclick=()=>{stopQibla();slot.querySelector(".qibla").dataset.on="false"};
}
async function startQibla(){
  const card=$(".qibla"),read=$("#qRead"),arrow=$("#qArrow");
  try{
    if(typeof DeviceOrientationEvent.requestPermission==="function"&&await DeviceOrientationEvent.requestPermission()!=="granted"){
      toast("Motion access was declined. The mihrab shows the direction.");return;
    }
  }catch(e){toast("Couldn’t access the compass on this phone.");return}
  stopQibla();
  card.dataset.on="true";
  const evt="ondeviceorientationabsolute" in window?"deviceorientationabsolute":"deviceorientation";
  let got=false;
  const onTurn=e=>{
    let h=e.webkitCompassHeading;
    if(h==null&&e.absolute&&e.alpha!=null)h=360-e.alpha;
    if(h==null)return;
    got=true;
    h=(h+((screen.orientation&&screen.orientation.angle)||0))%360;
    const turn=((QIBLA-h)%360+360)%360;
    arrow.style.transform=`rotate(${turn}deg)`;
    const off=turn>180?turn-360:turn;
    /* round to 5° so screen readers aren't flooded while turning */
    const msg=Math.abs(off)<=8?"You’re facing the qibla":off>0?`Turn right ${Math.round(off/5)*5}°`:`Turn left ${Math.round(-off/5)*5}°`;
    if(read.textContent!==msg)read.textContent=msg;
  };
  addEventListener(evt,onTurn);
  const t=setTimeout(()=>{if(!got){read.textContent="This phone isn’t reporting a compass heading. The mihrab shows the direction."}},3000);
  qiblaOff=()=>{removeEventListener(evt,onTurn);clearTimeout(t)};
}
function stopQibla(){if(qiblaOff){qiblaOff();qiblaOff=null}}

/* ---------- Router ---------- */
function route(){
  stopAudio();closeScan();stopQibla();
  const h=location.hash.replace("#","");
  const idx=STATIONS.findIndex(s=>s.id===h);
  const mIdx=h.startsWith("more-")?STATIONS.findIndex(s=>"more-"+s.id===h):-1;
  if(idx>-1)vStation(idx);
  else if(mIdx>-1)vMore(mIdx);
  else if(h==="tour")vTour();
  else if(h==="questions")vQuestions();
  else if(h==="finish")vFinish();
  else if(h==="plaques")vPlaques();
  else vWelcome();
  window.scrollTo(0,0);
  /* Tell screen readers the view changed: move focus to the new heading */
  if(routed){const h1=app.querySelector("h1");if(h1){h1.tabIndex=-1;h1.style.outline="none";h1.focus({preventScroll:true})}}
  routed=true;
}
let routed=false;
$("#barName").textContent=MOSQUE.name;
window.addEventListener("hashchange",route);
window.addEventListener("pagehide",()=>{stopAudio();closeScan()});
route();
</script>
